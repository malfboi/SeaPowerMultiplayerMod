Taskforce1StartmessageMessage=Title=<size=24>Pacific Strike - PVP Mode</size>\nRUNNING THE PALAWAN PASSAGE\n<size=24>July 7th, 1985</size>\nBody=Allied units are moving south to join the defense of Singapore. USS Rentz has been ordered to transit the Palawan Passage towards Balabac Strait and then to Sandakan. A USSR submarine hasbeen reported in the area. Transit the strait successfully to win.\nButtonText=Start mission\nPopupStyle=Intro
Taskforce2StartmessageMessage=Title=<size=24>Pacific Strike - PVP Mode</size>\nRUNNING THE PALAWAN PASSAGE\n<size=24>July 7th, 1985</size>\nBody=Allied units are moving south to join the defense of Singapore. Submarine K-507 has been positioned as a blocking force to prevent Allied shipping from transiting the Balabac Strait. Sink the inbound American frigate, then await further orders.\nButtonText=Start mission\nPopupStyle=Intro
StartmessageForecast=FLEET WEATHER FORECAST FOR PALAWAN PASSAGE\nVALID: 070200Z-070800Z JUL 85\nMoist northerly flow over the Palawan Passage and adjacent Sulu Sea is producing overcast skies, intermittent rain, and areas of fog or low stratus along the north Borneo approaches. Seas remain slight to moderate at Sea State 2, but visibility will be locally poor in showers and fog banks. Conditions are expected to remain unsettled through the period, with no significant wind shift forecast.
