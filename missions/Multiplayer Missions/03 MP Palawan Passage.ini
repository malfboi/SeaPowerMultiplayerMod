Taskforce1StartmessageMessage=Title=<size=24>Тихоокеанский Удар - Часть 3</size>\nПалаванский пролив\n<size=24> 7 июля 1985</size>\nBody=Ваша оперативная группа выводится с Окинавы и должна отправиться на юг, чтобы присоединиться к обороне Сингапура. Пройдите по Палаванскому проливу, чтобы достигнуть Сандакана и присоединиться к формирующейся там группе подкрепления. Ожидайте засады вражеских подводных лодок.\n\nРазведка считает, что в проливе находятся 2-3 вражеские подводные лодки. Также, на острове Баламбаган на севере Борнео, были замечены батареи ПКР конторлирующие пролив. Авиаразведка не выявила наличия станционарных средств ПВО, но эксперты предполагают возможность присутствия ПЗРК, поэтому соблюдайте осторожность. \n\nПримечание: На данный момент в Сандакане царит хаос, так что пополнение боекомплекта и ремонт недоступны. Расходуйте боеприпасы разумно.\nButtonText=Начать миссию\nPopupStyle=Intro
StartmessageForecast=Прогноз погоды для Палаванского пролива\nАктуален: 070200Z-070800Z Июль 85\nПоток влажного воздуха с северного направления, проходящий над проливом Палаван и прилегающей акваторией моря Сулу, обусловливает пасмурную погоду, временами дожди, а также локальные туманы и низкую слоистую облачность на подходах к северному побережью острова Борнео. Волнение моря оценивается как слабое или умеренное (2 балла). Видимость местами будет ограниченной из-за ливней и зон тумана. Ожидается, что неустойчивая погода сохранится на протяжении всего периода, существенного изменения направления ветра не прогнозируется.
Taskforce1RentzsunkMessage=Title=МИССИЯ ПРОВАЛЕНА\nBody=Поражение! {FlagshipName} был потоплен!\nButtonText=Продолжить\nPopupStyle=Outro
Taskforce1Bluereachesescapepoint-playerwinsMessage=From=Ком. ТГ 77\nTo={TaskForceName}\nInfo=Ком. Тихоокеанским флотом США, Пёрл-Харбор\nSubj=МИССИЯ ВЫПОЛНЕНА\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1. (S) Мы подтверждаем получение Вашего сообщения, сообщающего об успешном прохождении пролива.\n\n2. (S) Отличная работа, командир! Поступайте в распоряжение местного командования и готовьтесь к обороне Сингапура.\nButtonText=Продолжить\nPopupStyle=NavalMessage\nMessageRole=Outro
