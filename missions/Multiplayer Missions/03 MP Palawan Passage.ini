Taskforce1StartmessageMessage=Title=<size=24>出击太平洋：第3部分</size>\n通过巴拉望航道\n<size=24>1985年7月7日</size>\nBody={TaskForceName}已离开冲绳，必须向南航行，加入新加坡的防御。通过巴拉望航道前往山打根，加入在那里组建的盟军增援部队。预计敌方将出动大量潜艇拦截。\n\n情报显示海峡内有2-3艘敌方潜艇，并且北婆罗洲巴兰邦岸岛出现了反舰导弹发射器。\n\n注意：由于此次行动的仓促性，你无法在山打根进行维修或补充弹药。请明智地使用军械。\nButtonText=开始任务\nPopupStyle=Intro
StartmessageForecast=巴拉望航道舰队天气预报\n有效期：1985年7月07日0200Z时至07日0800Z时\n受巴拉望航道和邻近苏禄海上空潮湿北风的影响，北婆罗洲附近海域阴云密布，间歇性降雨，伴有雾或低层云。海况维持在2级，但阵雨和雾会导致能见度局部降低。在此期间，预计天气状况仍不稳定，但风向无明显变化。
Taskforce1RentzsunkMessage=Title=任务失败！\nBody=任务失败！{FlagshipName}号已被击沉！\nButtonText=返回任务\nPopupStyle=Outro
Taskforce1Bluereachesescapepoint-playerwinsMessage=From=第77特遣舰队指挥官\nTo={TaskForceName}\nInfo=夏威夷州珍珠港太平洋舰队总司令\nSubj=穿越报告——任务完成\nPrecedence=Immediate\nClassification=Secret\nTemplate=USAUSNavy\nBody=1.（机密）我们确认收到你成功穿越海峡的消息。\n\n2.（机密）注意：由于此次行动的仓促性，你无法在山打根进行维修或补充弹药。\n\n3.（机密）干得好，指挥官。向当地指挥官报告，并保持对新加坡防御任务的准备。\nButtonText=返回任务\nPopupStyle=NavalMessage\nMessageRole=Outro
