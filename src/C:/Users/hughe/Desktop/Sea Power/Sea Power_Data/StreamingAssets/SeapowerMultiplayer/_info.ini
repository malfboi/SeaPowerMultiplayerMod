[Language_en]
Name=Seapower Multiplayer
Description=Real-time 2-player multiplayer (co-op and PvP) for Sea Power. One player hosts and sends a Steam invite, the other accepts, and the host's mission is synced across automatically.

Requires [u][url="https://steamcommunity.com/sharedfiles/filedetails/?id=3380210757"]Anchor Chain[/url][/u] and its preloader.

[b]Enable this mod in the mod menu, then fully restart the game.[/b] Applying a mod change only reloads the scene, it does not restart the process, so code mods cannot be loaded or unloaded until the game is closed and reopened. This applies when disabling it too.

Press Ctrl+F9 in-game to open the multiplayer overlay: host or connect, invite a friend, sync the scenario, and change all mod settings.

